repos:
  - repo: local
    hooks:
      - id: clang-format
        name: Format C sources (clang-format)
        entry: clang-format -i
        language: python
        additional_dependencies: [clang-format]
        files: ^(src|include|test|example)/.*\.[ch]$
        types: [file]
      - id: yamlfix
        name: Format YAML files (yamlfix)
        entry: yamlfix
        language: python
        additional_dependencies: [yamlfix]
        types: [yaml]
      - id: cmake-test
        name: Build and run CMake tests
        entry: cmake -P cmake/PreCommit.cmake
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
