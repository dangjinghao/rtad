name: Test rtad on all platforms

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  format:
    # Temporary: isolate the Windows ARM64 GCC cleanup failure.
    if: ${{ false }}
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Check formatting
        run: |
          pre-commit run clang-format --all-files --show-diff-on-failure
          pre-commit run yamlfix --all-files --show-diff-on-failure

  linux:
    if: ${{ false }}
    name: Linux-${{ matrix.arch }}-${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        arch: [x64, arm64]
        compiler: [gcc, clang]
        include:
          - arch: x64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DRTAD_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        working-directory: build
        run: ctest --output-on-failure -C Release

  macos:
    if: ${{ false }}
    name: macOS-${{ matrix.arch }}-${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        arch: [x64, arm64]
        compiler: [gcc-15, clang]
        include:
          - arch: x64
            os: macos-15-intel
          - arch: arm64
            os: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DRTAD_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release
      - name: Test
        working-directory: build
        run: ctest --output-on-failure -C Release

  windows:
    name: Windows-${{ matrix.arch }}-${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Temporary: run only this combination while diagnosing cleanup.
        include:
          - arch: arm64
            compiler: gcc
            os: windows-11-vs2026-arm
            generator: Ninja

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: |
          cmake -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DRTAD_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        working-directory: build
        run: ctest --output-on-failure -C Release
